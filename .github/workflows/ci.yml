name: Akidha Marketing OS CI

on:
  push:
    branches: [ main, develop, 'feature/**' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check Apps Script Syntax
        run: npm run lint:syntax

      - name: Run Automated Test Suite (Unit & Integration)
        run: npm test

      - name: Validate Clasp Tracking
        run: |
          test -f apps-script/appsscript.json || exit 1
          test -f apps-script/Code.js || exit 1
          test -f apps-script/Index.html || exit 1
          test -f .claspignore || exit 1

